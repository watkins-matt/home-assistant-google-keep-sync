# One Dependabot PR a month for everything: the Python test requirements, the
# pre-commit hooks and the GitHub Actions. Its title is conventional
# (chore(deps): ...), so it passes the title check and doesn't trigger a
# release.
#
# Python: ranges (>=) are left alone while the newest release fits them, so a
# loose minimum stays loose; exact pins (==) are bumped.
#
# gkeepapi and gpsoauth are also listed in manifest.json, which Dependabot
# doesn't read: tests/test_repository_consistency.py fails the PR until
# manifest.json lists the same version; then retitle it fix(deps): so it ships.
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope

updates:
  - package-ecosystem: pip
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    versioning-strategy: increase-if-necessary

  - package-ecosystem: pre-commit
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
