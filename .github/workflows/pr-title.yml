# "Squash and merge" uses the PR title as the commit message on main when a PR
# has more than one commit; release-please reads those messages. This fails a
# PR whose title isn't a conventional commit (feat: ..., fix(scope): ...).
name: PR Title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
