# "Squash and merge" uses the PR title as the commit message on main when a PR
# has more than one commit; release-please reads those messages. This fails a
# PR whose title isn't a conventional commit (feat: ..., fix(scope): ...).
#
# It's meant to be a required check, and checks belong to the PR's newest
# commit, so it also runs on synchronize (a push to the PR); without that, a
# PR would wait for it forever after every push. It also runs on pull_request
# because release-please's pushes to its release PR start pull_request
# workflows but not pull_request_target ones. Both report under the same name.
name: PR Title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
