# Monthly, one grouped PR per kind. PR titles are conventional (chore(deps): /
# ci(deps):), so they pass the title check and don't trigger a release.
# gkeepapi and gpsoauth are also listed in manifest.json, which Dependabot
# doesn't read: tests/test_repository_consistency.py fails such a PR until
# manifest.json lists the same version; retitle it fix(deps): so it ships.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
